---
name: Ubuntu setup

on: [push]

# Read-only token: no job writes to the repo, and a step compromised through a
# pinned tool or action gets nothing more than a clone could.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # See macos-setup.yml for why the checkout is linked into place instead of
      # letting the bootstrap clone the default branch.
      - name: Place the checkout at ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      # Teed so the steps below can read it; `shell: bash` for pipefail, so
      # tee's status cannot hide a failed bootstrap.
      - name: Run install script
        shell: bash
        run: bash bin/init/bootstrap-ubuntu.sh 2>&1 | tee "$RUNNER_TEMP/setup.log"
        env:
          DOTFILES_SKIP_UPDATE: '1'
          # See macos-setup.yml: attestation checks need GitHub credentials.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      # See macos-setup.yml: a missing link source is a warning and exit 0.
      - name: No link was skipped for a missing source
        run: |
          if grep -n 'missing source for link' "$RUNNER_TEMP/setup.log"; then
            exit 1
          fi

      # ubuntu.sh does not run link_dotfiles, so the cooldown configs reached a Linux
      # machine only at its first update-all: until then pip, uv, pnpm and
      # yarn installed with no 7-day cooldown. Nothing failed while they were
      # missing, so only their presence can show it. The function itself is
      # asked, in check mode, so a config added to it is checked here too.
      - name: The package manager cooldown configs are linked
        run: |
          DOTFILES_DIR="$HOME/dotfiles"
          . bin/init/common.sh
          . bin/init/links.sh
          out=$(LINK_CHECK=1 link_package_manager_configs)
          printf '%s\n' "$out"
          [ -z "$out" ]

      # update-all re-syncs links only through relink, and only if it is on
      # PATH. ubuntu.sh links inline rather than through link_dotfiles, so relink
      # may well report drift here; what is checked is that it is linked and
      # runs to its prompt (declined via </dev/null) rather than failing.
      - name: relink is linked and runs
        run: |
          [ -L "$HOME/.local/bin/relink" ]
          "$HOME/.local/bin/relink" </dev/null
