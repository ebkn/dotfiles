---
name: macOS setup

on: [push]

# Read-only token: no job writes to the repo, and a step compromised through a
# pinned tool or action gets nothing more than a clone could.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The bootstrap resolves everything under $HOME/dotfiles, so point that at
      # this checkout. Previously CI curled the script from the main branch and
      # let it clone the default branch, so every job validated main no matter
      # which branch was pushed — a green check that could not fail on unmerged
      # code.
      - name: Place the checkout at ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      # The runner image ships ruby@3.4 plus RubyGems files that no keg owns
      # (docs and a bundler from a `gem update --system` while building the
      # image). The next ruby@3.4 bottle carries the same paths, so `brew
      # upgrade` cannot link it and setup stops, failing on the image rather
      # than on this repo. No Brewfile installs ruby, so it goes, with the
      # gem tree; if a runner formula needs it, the upgrade pours it fresh.
      - name: Remove the runner's ruby@3.4 and its unowned gems
        run: |
          brew uninstall --ignore-dependencies --force ruby@3.4
          rm -rf "$(brew --prefix)"/lib/ruby/gems/3.4.0

      # Teed so the steps below can read it. `shell: bash` for pipefail: the
      # default shell would report tee's status and hide a failed bootstrap.
      - name: Run install script
        shell: bash
        run: zsh bin/init/bootstrap-macos.sh 2>&1 | tee "$RUNNER_TEMP/setup.log"
        env:
          DOTFILES_SKIP_UPDATE: '1'
          # Setup verifies every bottle's attestation, which needs GitHub
          # credentials and has no terminal here to log in from. This
          # read-only token is enough for the attestations API, and without
          # it setup stops before its first install (bin/init/common.sh).
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

      # Exit 0 says the install steps worked; it says nothing about the links.
      # A missing link source is a warning and exit 0, so a typo in links.sh or
      # an init script passes the step above while the link is never made.
      - name: No link was skipped for a missing source
        run: |
          if grep -n 'missing source for link' "$RUNNER_TEMP/setup.log"; then
            exit 1
          fi

      # macos.sh runs link_dotfiles, so right after it relink -- the drift
      # check update-all runs on every machine -- must find nothing to do.
      - name: relink finds no drift
        run: |
          out=$("$HOME/dotfiles/bin/relink" </dev/null 2>&1)
          printf '%s\n' "$out"
          grep -qx 'dotfiles symlinks are up to date.' <<<"$out"
