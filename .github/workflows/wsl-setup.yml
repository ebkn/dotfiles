---
name: WSL setup

on: [push]

# Read-only token: no job writes to the repo, and a step compromised through a
# pinned tool or action gets nothing more than a clone could.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # See macos-setup.yml for why the checkout is linked into place instead of
      # letting the bootstrap clone the default branch.
      - name: Place the checkout at ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      # Teed so the steps below can read it; `shell: bash` for pipefail, so
      # tee's status cannot hide a failed bootstrap.
      - name: Run install script
        shell: bash
        run: bash bin/init/bootstrap-wsl.sh 2>&1 | tee "$RUNNER_TEMP/setup.log"
        env:
          DOTFILES_SKIP_UPDATE: '1'
          # See macos-setup.yml: setup requires GitHub credentials, and CI
          # skips attestation checks, whose API calls exhaust the token.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_VERIFY_ATTESTATIONS: '1'

      # See macos-setup.yml: a missing link source is a warning and exit 0.
      - name: No link was skipped for a missing source
        run: |
          if grep -n 'missing source for link' "$RUNNER_TEMP/setup.log"; then
            exit 1
          fi

      # See ubuntu-setup.yml: wsl.sh does not run link_dotfiles either.
      - name: The package manager cooldown configs are linked
        run: |
          DOTFILES_DIR="$HOME/dotfiles"
          . bin/init/common.sh
          . bin/init/links.sh
          out=$(LINK_CHECK=1 link_package_manager_configs)
          printf '%s\n' "$out"
          [ -z "$out" ]

      # See ubuntu-setup.yml: relink must be linked and run to its prompt.
      - name: relink is linked and runs
        run: |
          [ -L "$HOME/.local/bin/relink" ]
          "$HOME/.local/bin/relink" </dev/null
