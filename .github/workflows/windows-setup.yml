---
name: Windows setup

on: [push]

jobs:
  build:
    runs-on: windows-latest
    # A job over its limit is CANCELLED, not failed: fifteen runs in a row hit
    # GitHub's six-hour default on the GnuPG installer and ended grey, so nothing
    # after it had ever run in CI. This only bounds the runner time; the
    # install step's own limit below is what is meant to turn a hang red.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: winget exit-code classification
        run: powershell -ExecutionPolicy Bypass -File bin\init\winget-result.test.ps1
      - name: Run install script
        timeout-minutes: 75
        run: powershell -ExecutionPolicy Bypass -File bin\init\windows.ps1
      # The script's exit status says winget agreed; this says the steps after
      # it did what they are for. Also after the script failed: it collects
      # package failures and carries on, and that the later steps still ran is
      # then exactly what needs checking.
      - name: Check what the script left behind
        if: success() || failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ahk = Join-Path $env:USERPROFILE 'Documents\AutoHotkey\keyremap.ahk'
          if (-not (Test-Path $ahk)) { throw "keyremap.ahk was not copied to $ahk" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'keyremap.lnk'
          if (-not (Test-Path $lnk)) { throw "no startup shortcut at $lnk" }
          $map = Get-ItemPropertyValue -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layout' -Name 'Scancode Map'
          if (($map[12..15] -join ',') -ne '29,0,58,0') { throw "Scancode Map does not remap CapsLock: $($map -join ',')" }
          foreach ($id in 'Google.Chrome', 'wez.wezterm', 'GnuPG.GnuPG', 'AutoHotkey.AutoHotkey') {
            winget list --exact --id $id --accept-source-agreements | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$id is not installed" }
          }
          Write-Host 'ok'
