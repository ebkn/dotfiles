---
name: Lint and test

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh is not on the runner image, and the zsh -n pass silently covers
      # nothing without it.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # shellcheck DOES ship with the runner image, and using that copy is what
      # broke this job: the image's version moved, started reporting SC2317 on a
      # review-test eval helper, and main went red with nobody having touched a
      # shell script. Local shellcheck said nothing about the same file, so the
      # invariant this gate rests on -- CI runs the same command, therefore local
      # and CI cannot disagree -- was quietly untrue for the shellcheck pass.
      #
      # So it is pinned exactly like shfmt below, for the same reason and with
      # the same obligations: bump both the version and the checksum together,
      # and keep the version in step with brewfiles/Brewfile-shell. /usr/local/bin
      # precedes /usr/bin on the runner, so this copy is the one bin/lint-shell
      # finds.
      #
      # The checksum is of the release asset as fetched; koalaman publishes no
      # per-file digest in the release notes, so it pins "what this URL served
      # when the pin was made" rather than an upstream-signed value.
      - name: Install shellcheck
        run: |
          version=0.11.0
          expected=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          echo "${expected}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # shfmt is not on the runner image and is not packaged for Ubuntu, so the
      # release binary is installed at a pinned version with its SHA256
      # verified. Without the checksum this step would silently accept whatever
      # that URL serves; without the version pin a new upstream release would
      # reformat the repo out from under a PR that touched nothing.
      #
      # Bump both together, and keep the version in step with brewfiles/
      # Brewfile-shell so local and CI cannot format differently. The checksum
      # comes from https://github.com/mvdan/sh/releases.
      - name: Install shfmt
        run: |
          version=3.13.1
          expected=fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          curl -fsSL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/v${version}/shfmt_v${version}_linux_amd64"
          echo "${expected}  shfmt" | sha256sum --check --strict
          sudo install -m 0755 shfmt /usr/local/bin/shfmt

      - name: Lint shell scripts
        run: bin/lint-shell

  # Every suite, through bin/test: it discovers them with git ls-files and runs
  # them in parallel, so there is no list here for a new suite to be missing
  # from, and no step whose failure hides the ones after it. Why each suite
  # gates CI is in bin/test.md; this job only installs what the suites run
  # against. bin/ci-enrollment.test.sh (one of the suites) checks that this
  # job does run bin/test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh runs the zsh/ unit tests and does not ship with the runner image.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # agent-state.sh drives the tab glyph and the prefix+a picker off tmux
      # pane options, and agent-state.test.sh runs a throwaway tmux server
      # against the real thing -- so tmux is not a convenience here, it is the
      # subject under test. It fails rather than skips without it, on purpose.
      #
      # BUILT FROM A PINNED RELEASE, not `apt-get install tmux`, for the reason
      # the shellcheck step above spells out: what the distro hands over moves,
      # and an unpinned tool in a gate fails on somebody else's commit. It also
      # has to be the version the developer runs, because what this suite pins is
      # how values survive a round trip through `set-option` and a `-F` format,
      # and tmux has changed how it renders non-printable bytes between releases.
      # `apt-get install tmux=<version>` would not do: Ubuntu drops the old
      # package from the archive on a security update, and the pin then fails
      # with "Version not found" instead of installing the wrong thing.
      #
      # Keep the version in step with brewfiles/Brewfile-shell and with the same pin
      # in bin/test-in-docker.Dockerfile -- all three together. The checksum is
      # of the release tarball as fetched (upstream publishes no digest beside
      # it).
      #
      # bison is named even though the runner image already has it: `./configure`
      # fails with `"yacc not found"` without one, and relying on the image to
      # carry it is the same bet this step exists to stop making. Found by
      # running the job in an ubuntu:24.04 container, where it is absent.
      - name: Install tmux
        run: |
          version=3.7c
          expected=7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf
          sudo apt-get install -y -qq libevent-dev libncurses-dev pkg-config bison
          curl -fsSL -o tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${version}/tmux-${version}.tar.gz"
          echo "${expected}  tmux.tar.gz" | sha256sum --check --strict
          tar -xzf tmux.tar.gz
          cd "tmux-${version}"
          ./configure --prefix=/usr/local >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install >/dev/null

      # fzf is what bin/tmux-agents runs to draw the picker, and the runner
      # image does not carry it. tmux-agents.test.sh drives the real binary in a
      # real pane and reads the rendered screen back, so this is the subject
      # under test in the same sense tmux is -- a stub could only confirm the
      # command line, and what is worth confirming is what fzf puts on the
      # screen and what it does with a key.
      #
      # Pinned, and to the version brewfiles/Brewfile-shell installs, for the
      # same reason as tmux: the assertions read rendered output, so a version
      # that draws or binds differently is a green local run against a red CI
      # one. The checksum is upstream's own, from the release's checksums file.
      # bin/test-in-docker.Dockerfile carries the same pin: bump all three.
      - name: Install fzf
        run: |
          version=0.74.3
          expected=3501a595e4b5c40a6b047340a0e8f805c46fd4e61ef95ef8a136ba8c61cf6f22
          curl -fsSL -o fzf.tar.gz \
            "https://github.com/junegunn/fzf/releases/download/v${version}/fzf-${version}-linux_amd64.tar.gz"
          echo "${expected}  fzf.tar.gz" | sha256sum --check --strict
          tar -xzf fzf.tar.gz
          sudo install -m 0755 fzf /usr/local/bin/fzf

      # pandoc is what read-doc runs, and read-doc.test.sh asserts on the HTML
      # it renders, so it is the subject under test in the same sense as tmux
      # and fzf above. The runner has none, and the distro package predates
      # --syntax-highlighting, which read-doc passes. Pinned for the same
      # reason as the others; the checksum is of the release tarball as
      # fetched (upstream publishes no digest beside it). bin/test-in-docker.
      # Dockerfile and brewfiles/Brewfile-shell carry the same pin: bump all
      # three.
      - name: Install pandoc
        run: |
          version=3.12
          expected=67d7d011fed8c8543306022b985b9b2499ab9b74818df91d8727c7e9ebc5ba06
          curl -fsSL -o pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-linux-amd64.tar.gz"
          echo "${expected}  pandoc.tar.gz" | sha256sum --check --strict
          tar -xzf pandoc.tar.gz
          sudo install -m 0755 "pandoc-${version}/bin/pandoc" /usr/local/bin/pandoc

      # GNU parallel schedules the suites in bin/test, and decides from its job
      # log which ran and whether they passed -- so it is pinned like the
      # linters, not taken from the image. The image's own copy (apt's
      # 20231122) moves with the image; this one lands in /usr/local/bin, which
      # precedes /usr/bin. The checksum is of the release tarball as fetched,
      # the same one Homebrew's formula records. bin/test-in-docker.Dockerfile
      # and brewfiles/Brewfile-shell carry the same pin: bump all three.
      - name: Install GNU parallel
        run: |
          version=20260922
          expected=54837e9e8c16134a3c2e95f91c5fe2f7893d4cc89f252b26735713ceca866387
          curl -fsSL -o parallel.tar.bz2 \
            "https://ftp.gnu.org/gnu/parallel/parallel-${version}.tar.bz2"
          echo "${expected}  parallel.tar.bz2" | sha256sum --check --strict
          tar -xjf parallel.tar.bz2
          cd "parallel-${version}"
          ./configure --prefix=/usr/local >/dev/null
          sudo make install >/dev/null

      # Printed, not assumed. The version is the one thing that explains a
      # failure in the round-trip cases, and the run that found that out had no
      # record of it.
      - name: Versions under test
        run: |
          tmux -V
          zsh --version
          fzf --version
          pandoc --version | head -n 1
          parallel --version | head -n 1

      - name: Test suites
        run: bin/test
