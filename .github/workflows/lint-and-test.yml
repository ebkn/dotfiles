---
name: Lint and test

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zsh is not on the runner image, and the zsh -n pass silently covers
      # nothing without it.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # shellcheck DOES ship with the runner image, and using that copy is what
      # broke this job: the image's version moved, started reporting SC2317 on a
      # review-test eval helper, and main went red with nobody having touched a
      # shell script. Local shellcheck said nothing about the same file, so the
      # invariant this gate rests on -- CI runs the same command, therefore local
      # and CI cannot disagree -- was quietly untrue for the shellcheck pass.
      #
      # So it is pinned exactly like shfmt below, for the same reason and with
      # the same obligations: bump both the version and the checksum together,
      # and keep the version in step with brewfiles/Brewfile-shell. /usr/local/bin
      # precedes /usr/bin on the runner, so this copy is the one bin/lint-shell
      # finds.
      #
      # The checksum is of the release asset as fetched; koalaman publishes no
      # per-file digest in the release notes, so it pins "what this URL served
      # when the pin was made" rather than an upstream-signed value.
      - name: Install shellcheck
        run: |
          version=0.11.0
          expected=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          echo "${expected}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # shfmt is not on the runner image and is not packaged for Ubuntu, so the
      # release binary is installed at a pinned version with its SHA256
      # verified. Without the checksum this step would silently accept whatever
      # that URL serves; without the version pin a new upstream release would
      # reformat the repo out from under a PR that touched nothing.
      #
      # Bump both together, and keep the version in step with brewfiles/
      # Brewfile-shell so local and CI cannot format differently. The checksum
      # comes from https://github.com/mvdan/sh/releases.
      - name: Install shfmt
        run: |
          version=3.13.1
          expected=fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          curl -fsSL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/v${version}/shfmt_v${version}_linux_amd64"
          echo "${expected}  shfmt" | sha256sum --check --strict
          sudo install -m 0755 shfmt /usr/local/bin/shfmt

      - name: Lint shell scripts
        run: bin/lint-shell

      # bin/lint-shell discovers its own targets, and the way that discovery
      # fails is by checking almost nothing and reporting ok. This is the only
      # check that the gate above is actually looking at the repo.
      - name: lint-shell target enumeration
        run: bash bin/lint-shell.test.sh

      # This workflow lists its suites by hand, so a suite can be written and
      # documented as gating CI while no step runs it -- three did. Static.
      - name: every suite is run by CI
        run: bash bin/ci-enrollment.test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # curl-guard.sh decides whether a curl invocation is auto-approved, so a
      # regression here widens a permission boundary rather than breaking a
      # feature — worth gating every push.
      #
      # root/.codex/rules/default.rules.test.sh is deliberately NOT run here: it
      # needs the codex CLI, which is not on the runner, and would exit 0 with
      # "skipping" — a permanently green check that proves nothing. Run it
      # locally after editing default.rules, as CLAUDE.md describes.
      - name: curl-guard hook
        run: bash root/.claude/hooks/curl-guard.test.sh

      # approve-multiline-commands.sh is the only hook here that emits "allow",
      # so a regression widens a permission boundary silently -- the command
      # just runs. Gated on every push for the same reason as curl-guard.
      # rm-guard.sh is the other allow-emitting hook: it decides whether an rm
      # stays inside a scratch dir. Same reasoning as curl-guard — a regression
      # widens a permission boundary rather than breaking a feature.
      - name: rm-guard hook
        run: bash root/.claude/hooks/rm-guard.test.sh

      - name: approve-multiline-commands hook
        run: bash root/.claude/hooks/approve-multiline-commands.test.sh

      # The retrospective skill's two scripts. Both tests run against synthetic
      # transcripts, so they need only jq (on the runner image) and nothing
      # from ~/.claude. The reporter test also does a bash -n on the script:
      # it is one long single-quoted jq program, and an apostrophe in a jq
      # comment has twice ended the string and failed every case at once.
      - name: retrospective session-extract
        run: bash root/.agents/skills/retrospective/session-extract.test.sh
      - name: retrospective session-review
        run: bash root/.agents/skills/retrospective/session-review.test.sh

      # bin/skill-eval is the only instrument for "did that SKILL.md edit help",
      # and every way it breaks leaves a green run that measured nothing -- a
      # dropped allowed-tools, a fixture that can read its own grader, a
      # swallowed FAIL. claude is stubbed, so this makes no API call and costs
      # nothing; the eval cases themselves are never run in CI, since they do.
      - name: skill-eval runner
        run: bash bin/skill-eval.test.sh

      # The grader of one eval case, plus the Makefile that case grades: the
      # test extracts it from references/swift.md and runs it, so a TAB lost in
      # the documentation fails here. Same reasoning as the runner above -- an
      # inert grader reports a green eval run that measured nothing, and the
      # eval run is a paid, non-deterministic place to find that out.
      - name: init-project swift case grader
        run: bash root/.agents/skills/init-project/evals/swift-makefile-entry-point/assert.test.sh

      # zsh is needed by the zsh unit tests below and does not ship with the
      # runner image.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # agent-state.sh drives the tab glyph and the prefix+a picker off tmux
      # pane options, and agent-state.test.sh runs a throwaway tmux server
      # against the real thing -- so tmux is not a convenience here, it is the
      # subject under test. It fails rather than skips without it, on purpose.
      #
      # BUILT FROM A PINNED RELEASE, not `apt-get install tmux`, for the reason
      # the shellcheck step above spells out: what the distro hands over moves,
      # and an unpinned tool in a gate fails on somebody else's commit. It also
      # has to be the version the developer runs, because what this suite pins is
      # how values survive a round trip through `set-option` and a `-F` format,
      # and tmux has changed how it renders non-printable bytes between releases.
      # `apt-get install tmux=<version>` would not do: Ubuntu drops the old
      # package from the archive on a security update, and the pin then fails
      # with "Version not found" instead of installing the wrong thing.
      #
      # Keep the version in step with brewfiles/Brewfile-shell. The checksum is
      # of the release tarball as fetched (upstream publishes no digest beside
      # it).
      #
      # bison is named even though the runner image already has it: `./configure`
      # fails with `"yacc not found"` without one, and relying on the image to
      # carry it is the same bet this step exists to stop making. Found by
      # running the job in an ubuntu:24.04 container, where it is absent.
      - name: Install tmux
        run: |
          version=3.7c
          expected=7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf
          sudo apt-get install -y -qq libevent-dev libncurses-dev pkg-config bison
          curl -fsSL -o tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${version}/tmux-${version}.tar.gz"
          echo "${expected}  tmux.tar.gz" | sha256sum --check --strict
          tar -xzf tmux.tar.gz
          cd "tmux-${version}"
          ./configure --prefix=/usr/local >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install >/dev/null

      # fzf is what bin/tmux-agents runs to draw the picker, and the runner
      # image does not carry it. tmux-agents.test.sh drives the real binary in a
      # real pane and reads the rendered screen back, so this is the subject
      # under test in the same sense tmux is -- a stub could only confirm the
      # command line, and what is worth confirming is what fzf puts on the
      # screen and what it does with a key.
      #
      # Pinned, and to the version brewfiles/Brewfile-shell installs, for the
      # same reason as tmux: the assertions read rendered output, so a version
      # that draws or binds differently is a green local run against a red CI
      # one. The checksum is upstream's own, from the release's checksums file.
      - name: Install fzf
        run: |
          version=0.74.3
          expected=3501a595e4b5c40a6b047340a0e8f805c46fd4e61ef95ef8a136ba8c61cf6f22
          curl -fsSL -o fzf.tar.gz \
            "https://github.com/junegunn/fzf/releases/download/v${version}/fzf-${version}-linux_amd64.tar.gz"
          echo "${expected}  fzf.tar.gz" | sha256sum --check --strict
          tar -xzf fzf.tar.gz
          sudo install -m 0755 fzf /usr/local/bin/fzf

      # Printed, not assumed. The version is the one thing that explains a
      # failure in the round-trip cases below, and the run that found that out
      # had no record of it.
      - name: Versions under test
        run: |
          tmux -V
          zsh --version
          fzf --version

      # Every tmux suite must refuse to run on a developer machine, where one
      # missed `unset TMUX` killed the real server. Static: it runs nothing.
      - name: tmux suites are guarded
        run: bash bin/tmux-test-guard.test.sh

      - name: agent-state hook
        run: bash root/.claude/hooks/agent-state.test.sh

      # tmux-popup names the popup session, and the prefix + p/t/o guards in
      # .tmux.conf match that name with `_*`. Breaking the naming makes the
      # guard stop recognising popups and the chord starts stacking them, with
      # no error anywhere.
      - name: tmux-popup
        run: bash bin/tmux-popup.test.sh

      # .tmux.conf is never re-read on a working machine, so a bad line sits
      # there unnoticed; and a bind that lost its -N note keeps working while
      # disappearing from the cheatsheet.
      - name: tmux config and cheatsheet
        run: bash bin/tmux-conf.test.sh

      # One WezTerm tab means one tmux session; tmux enforces nothing of the
      # sort. Both of these keep that invariant, and both fail silently -- the
      # tab you switched away from starts mirroring another one, minutes later,
      # after an autossh reconnect.
      - name: tmux-session-swap
        run: bash bin/tmux-session-swap.test.sh

      - name: tmux-track-session
        run: bash bin/tmux-track-session.test.sh

      # Restored tabs must land in the window they were asked from, attached to
      # the exact session. Both broke silently: every tab in a new window, and a
      # numeric name cut out of its own timestamp.
      - name: tmux-restore-tabs
        run: bash bin/tmux-restore-tabs.test.sh

      # One restored tab per remote session, each named explicitly. A failed
      # `adopt` read as an empty list would restore nothing and say so politely.
      - name: tmux-restore-ssh-tabs
        run: bash bin/tmux-restore-ssh-tabs.test.sh

      # Both of these turn pane options into something a person reads -- a tab
      # label and the prefix + a list. Every mistake renders a plausible wrong
      # answer rather than an error.
      - name: tmux-pane-titles
        run: bash bin/tmux-pane-titles.test.sh

      - name: tmux-agents
        run: bash bin/tmux-agents.test.sh

      # The answer view mirrors a blocked agent's window in a popup. Its name
      # must keep matching the _* guard and C-] must stay bound, or the leave
      # key types into the agent's own pane -- the one place a stray key counts.
      - name: tmux-agent-view
        run: bash bin/tmux-agent-view.test.sh

      # The autossh reconnect shim owns the screen between attempts. Getting its
      # passthrough wrong breaks every first connection; getting the notice wrong
      # leaves a dead remote frame and a flood of mouse reports. ssh is stubbed.
      - name: autossh-ssh shim
        run: bash bin/autossh-ssh.test.sh

      # The lock both review-pipeline programs take. Refusing to steal a dead
      # holder's lock stops the pipeline forever with no output, since both
      # programs exit 0 when they cannot take it; stealing a live one lets two
      # runs interleave writes to the same job file.
      - name: pr-review lock
        run: bash bin/pr-review-common.test.sh

      # pr-review-watch queues review feedback for the session working on the
      # branch. Both of its failure modes are silence: a filter that matches
      # nothing looks exactly like "no reviews arrived", and one that stops
      # dropping the token's own comments builds a reply loop. gh, ghq, claude
      # and terminal-notifier are stubbed, so nothing here touches the network.
      - name: pr-review-watch
        run: bash bin/pr-review-watch.test.sh

      # pr-review-dispatch posts to a live Claude session's inbox socket. The
      # message schema is undocumented and a rejected line is dropped in
      # silence, so the suite asserts the exact bytes on a real socket (nc -lU):
      # that is the only thing that goes red if the protocol moves.
      - name: pr-review-dispatch
        run: bash bin/pr-review-dispatch.test.sh

      # pr-state-watch is the second detector on the same queue, for the
      # thing GitHub sends no notification about at all. Its two failure modes
      # are opposite and both silent: reading GitHub's lazily-computed UNKNOWN
      # as "mergeable" makes it go quiet, and re-announcing a conflict that has
      # not changed trains its reader to ignore it.
      - name: pr-state-watch
        run: bash bin/pr-state-watch.test.sh

      # _ssh_parse_argv decides which argv element is the host. Its option list
      # is a hand-copied subset of ssh(1), so it rots silently whenever openssh
      # adds an option that takes an argument -- the parse then reads that
      # argument as the host and myssh reconnects somewhere else entirely.
      - name: ssh argv parser
        run: zsh zsh/ssh-parse-argv.test.zsh

      # The pane decoration must be symmetrical. A pane left carrying
      # @ssh_my_machine swallows prefix + p forever, sending it to a remote tmux
      # that is not there -- with no error.
      - name: ssh pane decoration
        run: zsh zsh/ssh-decorate.test.zsh

      # MYSSH_SESSION must reach the remote as one argument, or a restored tab
      # opens a fresh empty session beside the one it was meant to restore.
      - name: ssh remote session
        run: zsh zsh/ssh-session.test.zsh

      # rm() routes deletions through trash. Both of its failure modes look
      # like a successful delete from the shell, so they can only be caught
      # here: losing the fallback leaves Linux with no working rm, and handing
      # the wrong argv to trash deletes the wrong thing.
      - name: rm wrapper
        run: zsh zsh/rm.test.zsh

      # fd()'s only observable behaviour is which directory the shell ends up
      # in, so a misplaced cd is invisible until it lands somewhere wrong.
      - name: fd directory picker
        run: zsh zsh/fd.test.zsh

      # gw() and gdmerged() are the destructive pair: gdmerged deletes branches
      # and removes worktrees, gw checks out other people's PRs. The cases run
      # against real repositories in a temp dir, because the contract is what
      # git ends up holding.
      - name: git worktree workflow
        run: zsh zsh/git-worktree.test.zsh

      # The keepalive ping is disowned, so nothing else would ever stop it: the
      # supervisor that kills it when its shell dies is the only bound. A
      # regression here is a process pinging at 3 packets a second until reboot.
      - name: ssh keepalive lifetime
        run: zsh zsh/ssh-keepalive.test.zsh

      # .zshrc resolves its own directory to find zsh/. Getting that expansion
      # wrong does not error -- the shell simply starts with no configuration.
      - name: zshrc module resolution
        run: zsh zsh/zshrc-resolve.test.zsh

      # .zshenv's Linuxbrew probe must be guarded on $OSTYPE: on macOS a stat
      # under /home wakes autofs and costs ~16ms on every zsh start, silently.
      # The suite asserts both branches, so the Linux runner checks the guard
      # as well as the Linux side.
      - name: zshenv autofs guard
        run: zsh zsh/zshenv-autofs.test.zsh

      # his() and gs() were one definition per platform until `sed -E` replaced
      # the gsed/sed split. This job runs them against GNU sed; the same file
      # run on macOS covers BSD sed, and the pair is the only check that the
      # two really agree.
      - name: his and gs
        run: zsh zsh/his.test.zsh

      # update-all's uptime warning predicts a failure that gives no notice of
      # its own, so a warning that quietly stopped firing would look exactly
      # like a machine that is fine. The runner is Linux, so the kernel release
      # and uptime are stubbed, and the two cases that hold the stub against a
      # real Mac's sysctl are skipped here.
      - name: update-all uptime warning
        run: zsh zsh/update.test.zsh
