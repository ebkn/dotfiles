# plugins
set -g @plugin 'tmux-plugins/tpm'
# persist environments (tmux-resurrect + tmux-continuum)
#   Saves: session/window/pane layout, working directories, and running commands.
#   Does NOT save: scrollback, env vars, or process internal state.
#   Identical state is deduplicated (no new file if nothing changed).
#
#   Auto-save:  every 3 minutes via continuum (hooked into status-right)
#   Auto-restore: on tmux server start (@continuum-restore on)
#   Manual save:    prefix + C-s
#   Manual restore: prefix + C-r
#   Saved files:    ~/.local/share/tmux/resurrect/
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# extract URLs from pane (uses capture-pane -J to join wrapped lines)
#   prefix + b  : pick a URL with fzf and open it (browse)
#   ctrl-y in fzf : copy URL to clipboard instead of opening
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'b'
set -g @fzf-url-history-limit '2000'

# set prefix key
set -g prefix C-q
unbind C-b
# send prefix to nested tmux (e.g. over SSH) with C-q C-q
bind -N "nested: send C-q to the tmux inside this pane" C-q send-prefix

set-option -g history-limit 500000

# enable mouse
set-option -g mouse on

# Work around a tmux 3.6a crash seen when mouse drag enters copy mode.
# In alternate screen apps, keep forwarding drag events instead of cloning
# the pane into copy mode.
bind-key -n MouseDrag1Pane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }

# OSC 52 clipboard forwarding
# Goal: Vim yank on SSH remote → host clipboard via OSC 52
# Chain: Neovim (OSC 52) → remote tmux → SSH → local tmux → WezTerm → macOS clipboard
#
# set-clipboard on    : accept OSC 52 from apps and forward to outer terminal
# terminal-overrides  : add Ms capability so tmux knows HOW to forward OSC 52
# terminal-features   : declare clipboard support so tmux actually forwards
#
# Pattern matches xterm-256color (WezTerm's $TERM, set by wezterm.lua `term`)
# for the outer terminal, and tmux-256color for nested tmux sessions (e.g. over SSH).
#
# RGB               : tells tmux the outer terminal supports 24-bit true color,
#                     so it passes through Neovim's RGB escape sequences as-is.
# Ms=\E]52;...      : OSC 52 template for clipboard forwarding.
# clipboard feature : enables tmux to accept and relay OSC 52 from inner apps.
# Allow DCS passthrough so OSC 7 (CWD notification) from the shell
# reaches WezTerm through tmux. Used by WezTerm Ctrl-T to spawn
# new tabs in the current directory.
set -g allow-passthrough on
set -s set-clipboard on
set-option -s terminal-overrides 'xterm-256color:RGB:Ms=\E]52;%p1%s;%p2%s\007'
set-option -as terminal-overrides ',tmux-256color:RGB:Ms=\E]52;%p1%s;%p2%s\007'
set-option -s terminal-features 'xterm-256color:clipboard:sixel'
set-option -as terminal-features ',tmux-256color:clipboard:sixel'

# default-terminal: the $TERM value seen by apps running inside tmux.
# tmux-256color lets Neovim (and other apps) detect true color support
# and safely enable termguicolors / 24-bit color output.
set -g default-terminal "tmux-256color"

# reduce delay
set -sg escape-time 1
set-option -g repeat-time 500

# index number
set -g base-index 1
set -g pane-base-index 1

setw -g monitor-activity on

# used for autoreading file changes at vim
set -g focus-events on

# session
# create new session
bind -N "session: new session in this directory" N new-session -c '#{pane_current_path}'
# Switch sessions. tmux's own `w` is choose-tree -Zw, whose Enter runs a plain
# switch-client: it will happily put this client on a session another client is
# already showing, and the two tabs then mirror each other. It also leaves the
# session you came from unattached, ready for the next pick to double up on.
# bin/tmux-session-swap turns the pick into a swap instead, so one WezTerm tab
# keeps meaning one session -- the invariant the whole setup here rests on, and
# the one bin/tmux-track-session needs to keep a remote session bound to exactly
# one ssh connection.
#
# Two commands because neither half can be done alone: choose-tree's template
# substitutes %% but cannot name the picking client, and `set -g` would store
# "#{client_tty}" literally rather than expanding it. run-shell does expand
# formats, against the client that pressed the key.
bind -N "session: switch session (swaps tabs if it is already open)" w {
  run-shell "tmux-session-swap arm '#{client_tty}'"
  choose-tree -Zw "run-shell 'tmux-session-swap go \"%%\"'"
}

# window
# disable tmux window hotkeys (managed by WezTerm tabs)
unbind c
unbind n
unbind p
# close current window (for WezTerm Cmd+W)
# Defer kill-window via run-shell -b to avoid a use-after-free crash
# in tty_keys_next (tmux 3.6a). Running kill-window synchronously
# inside the key-binding handler frees the window while tty_keys_next
# still holds references on the call stack.
bind-key -n F12 run-shell -b "tmux kill-window -t '#{window_id}'"
# split window
bind -N "pane: split left/right" v split-window -h -c '#{pane_current_path}'
bind -N "pane: split top/bottom" s split-window -v -c '#{pane_current_path}'

# pane
# select pane
bind -N "pane: focus left" h select-pane -L
bind -N "pane: focus down" j select-pane -D
bind -N "pane: focus up" k select-pane -U
bind -N "pane: focus right" l select-pane -R
# resize pane
bind -r -N "pane: grow left (hold to repeat)" H resize-pane -L 2
bind -r -N "pane: grow down (hold to repeat)" J resize-pane -D 2
bind -r -N "pane: grow up (hold to repeat)" K resize-pane -U 2
bind -r -N "pane: grow right (hold to repeat)" L resize-pane -R 2
# remove pane
bind -N "pane: kill this pane (asks first)" q confirm-before -p "kill-pane? (y/n)" kill-pane
# Pane options set by the ssh() / myssh() wrappers in zsh/alias.zsh:
#   @ssh_host       — set on any ssh pane; value is the target host. Drives the
#                     SSH indicator in the status bar and, through @ssh_view
#                     (defined near the status bar settings below), the purple
#                     status bar and pane border on this side of the connection.
#   @ssh_my_machine — set only when the user opened the pane with `myssh`, i.e.
#                     declared it to be one of their own machines (tmux +
#                     tmux-track-session expected on the remote). Used below so
#                     that prefix + p/t/o/u passes the chord through to the
#                     nested remote tmux; plain `ssh` panes and local panes
#                     fall back to the local popup / copy-mode.
#
# Each popup runs a real tmux session on this same server, so its client sees
# these same bindings — without a guard, prefix + p/t/o inside a popup stacks
# another popup on top of it. bin/tmux-popup names every session it opens
# _<name>_<id>, so a leading underscore means "this client is already a popup"
# and the chord is refused instead of nesting. Real sessions are never named
# that way (tmux-track-session uses the ssh conn id). That guard and the naming
# in tmux-popup are one rule split across two files: change either and the
# other has to follow.
#
# The session name, the per-tab id and the starting directory all live in
# bin/tmux-popup, which is why the three bindings below carry no shell quoting
# at all. They used to build the `tmux new-session` line inline, which meant
# `\$` and `\"` here — and, for the fzf command that had to survive one shell
# further down, `\\\$` and `\\\"`.
bind -N "popup: shell in this directory" p if-shell -F '#{m:_*,#{session_name}}' 'display-message "already in a popup"' {
  if-shell -F '#{@ssh_my_machine}' 'send-keys C-q p' 'display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "tmux-popup popup"'
}
# tig runs through bin/tmux-tig rather than directly: a popup closes the moment
# its command exits, so tig's own error (outside a work tree it prints "tig: Not a
# git repository" and exits 1) would flash past unread and the chord would look
# like it did nothing. The wrapper holds the popup open until a key is pressed.
bind -N "popup: tig (git browser)" t if-shell -F '#{m:_*,#{session_name}}' 'display-message "already in a popup"' {
  if-shell -F '#{@ssh_my_machine}' 'send-keys C-q t' 'display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "tmux-popup tig tmux-tig"'
}
bind -N "popup: open a file in nvim (fzf)" o if-shell -F '#{m:_*,#{session_name}}' 'display-message "already in a popup"' {
  if-shell -F '#{@ssh_my_machine}' 'send-keys C-q o' 'display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "tmux-popup fzf_nvim fzf-nvim"'
}
bind -N "open github: this repo's PR or page" g display-popup -E -d "#{pane_current_path}" -w 30 -h 3 'echo " Opening GitHub..." && (gh pr view --web 2>/dev/null || gh repo view --web) >/dev/null 2>&1; sleep 1'
# prefix + a — pick a Claude Code agent by state, and either jump to its tab
# (enter) or answer it from here (ctrl-o, see bin/tmux-agent-view).
#
# The 80%/60% below is duplicated in bin/tmux-agent-view, which reopens this
# same list after the answer view is detached: leaving it and coming back should
# land on the list at the size this key gives it. bin/tmux-agent-view.test.sh
# asserts the two agree.
# No arguments, for the reason documented above bind p: display-popup does not
# expand #{...} in the shell-command, so passing the calling client in would hand
# the script a literal "#{client_name}". It derives the client from $TMUX itself.
# Unlike the popups above this runs no tmux session of its own, so there is no
# per-tab session name to make unique.
bind -N "agents: jump to or answer a Claude Code session" a if-shell -F '#{m:_*,#{session_name}}' 'display-message "already in a popup"' {
  display-popup -E -w 80% -h 60% "tmux-agents"
}

# prefix + A — answer the first red one, with no list in between. The WezTerm
# tab bar's right edge says how many agents are blocked (see the update-status
# handler in wezterm.lua); this is the key it names, and the whole point is that
# seeing the count and acting on it is one motion rather than three.
#
# Skipping the picker is the feature, not a shortcut: the ranking in tmux-agents
# already floats the agent blocked longest to the top, so a popup opened only to
# accept its own first row would be a flash of a list nobody reads. When more
# than one is blocked the answer view drops you back into the real picker on the
# way out (bin/tmux-agent-view's attach mode), so nothing is lost by not
# starting there.
#
# run-shell rather than display-popup, and that is what lets the client be
# passed in: run-shell expands #{...} in its command (display-popup does not, as
# documented above bind p), and a run-shell child's $TMUX names the server, not
# which of its clients pressed the key. Absolute path for the same reason
# bin/tmux-agent-view resolves its sibling from $0 — run-shell uses the tmux
# SERVER's environment, whose $PATH need not hold ~/.local/bin.
bind -N "agents: answer the first blocked Claude Code session" A if-shell -F '#{m:_*,#{session_name}}' 'display-message "already in a popup"' {
  run-shell -b "~/.local/bin/tmux-agents --answer-first '#{client_name}'"
}

# C-] — leave the answer view. Deliberately NOT a prefix chord: inside the view
# you are looking at a pane that may itself hold an ssh session with its own
# tmux, and then C-q is ambiguous — local tmux, or remote? C-q C-q? A key that
# needs no prefix cannot be aimed at the wrong tmux.
#
# The cost of a root binding is that it is taken from every pane on the server,
# so it must be a key nothing wants: C-] is unbound in tmux, and outside a view
# it is passed straight through to the pane, so whatever did want it still gets
# it. C-o and C-e were considered and rejected — Claude Code and readline
# respectively use them, and swallowing them inside the view would be worse than
# the ambiguity this replaces.
#
# The -N note is what puts it in the cheatsheet; bin/tmux-cheatsheet drops the
# prefix token for non-prefix tables, so it renders as plain `C-]`. The key also
# has to stay in step with the footer and title bin/tmux-agent-view puts inside
# the popup, which is where it is actually advertised.
bind -N "agents: leave the answer view, back to the list" -n 'C-]' if-shell -F '#{m:_agent_*,#{session_name}}' 'detach-client' 'send-keys C-]'

# prefix + d — detach, but ask first. Inside an ssh pane the chord is NOT passed
# through to the remote tmux (unlike p/t/o/u), so a mistyped `d` detaches the
# client in front of you and drops you out of everything local — the expensive
# direction of the mistake, and the one that is easy to make while working on a
# remote. Popups are exempt: there `d` closes a popup, which is what it looks
# like it does, and asking on the way out of a view is friction with nothing to
# protect.
bind -N "session: detach this client (asks first)" d if-shell -F '#{m:_*,#{session_name}}' 'detach-client' 'confirm-before -p "detach this client? (y/n)" detach-client'

# prefix + ? — our bindings, grouped by category into columns, replacing tmux's
# own list-keys (which fills the whole window with the raw command of all ~85
# keys, in one unreadable column). The list is generated from `tmux list-keys
# -N`, so the `-N` notes above are the only place a binding is described: see
# bin/tmux-cheatsheet.
#
# The popup is wide (90%) on purpose: the script fits as many columns as the
# width allows, so a narrow popup silently collapses the grid back to the one
# column this replaced.
#
# Deliberately NOT guarded against running inside a popup, unlike p/t/o/a: it
# opens no tmux session of its own and changes nothing, so a cheatsheet stacked
# on a popup is merely redundant, and refusing it would be more surprising than
# showing it. It is not passed through to an ssh pane either — the remote runs
# these same dotfiles, so its list is this list.
bind -N "help: this list of key bindings" ? display-popup -E -w 90% -h 70% "tmux-cheatsheet"

# copy
bind -N "copy: enter copy mode (scrollback)" u if-shell -F '#{@ssh_my_machine}' 'send-keys C-q u' 'copy-mode'
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -N "start selection" -T copy-mode-vi v send-keys -X begin-selection
# Write to OS clipboard directly: pbcopy on macOS, clip.exe on WSL.
# clip.exe bypasses OSC 52 (which is unreliable through ConPTY on Windows)
# and writes via Win32 API. When neither command exists (e.g. SSH on a
# headless server), set-clipboard on still forwards via OSC 52.
#
# WSL detection uses a filesystem check on the absolute clip.exe path
# instead of `command -v clip.exe`. The PATH-based check is fragile —
# if the tmux server was started in a context where Windows interop
# PATH had not yet been appended, the binding was never registered and
# survived for the lifetime of the server. The absolute path is stable
# across WSL distros and PATH-independent.
if-shell '[ -x /usr/bin/pbcopy ]' {
  bind-key -N "yank selection to the clipboard" -T copy-mode-vi y   send-keys -X copy-pipe "pbcopy"
  bind-key -N "yank selection to the clipboard" -T copy-mode-vi M-c send-keys -X copy-pipe "pbcopy"
} {
  if-shell '[ -x /mnt/c/Windows/System32/clip.exe ]' {
    bind-key -N "yank selection to the clipboard" -T copy-mode-vi y   send-keys -X copy-pipe "/mnt/c/Windows/System32/clip.exe"
    bind-key -N "yank selection to the clipboard" -T copy-mode-vi M-c send-keys -X copy-pipe "/mnt/c/Windows/System32/clip.exe"
  }
}

# Exit copy mode with Escape or Ctrl-C
bind-key -N "leave copy mode" -T copy-mode-vi Escape send-keys -X cancel
bind-key -N "leave copy mode" -T copy-mode-vi C-c send-keys -X cancel
# @ssh_view — "this screen is showing another machine". One question, asked by
# every purple piece of chrome below (status bar, active pane border) so the
# rule lives in one place instead of being re-derived at each use.
#
# It is true two different ways because the two ends of an ssh connection know
# different things:
#   @ssh_host      — set by the ssh()/myssh() wrappers on the LOCAL pane
#                    (zsh/ssh.zsh). This is the only signal on this side.
#   session_name   — on the REMOTE there is no such option: a remote tmux has no
#                    way to know it is being looked at down a wire, and with
#                    myssh most of the screen (its own status line, its pane
#                    borders) is drawn by it, not by us. What it does have is
#                    the session name myssh asks for — `local-<pane id>` — so a
#                    session named that way exists only because some other
#                    machine's pane created it.
#
# Known hole, deliberately not papered over: switch to a differently-named
# session on the remote and the remote chrome goes back to green, because
# nothing about that session says it came from here. The name is the whole
# signal. A session literally named `local-…` on a machine you are sitting at
# would also read as remote — no cost worth a mechanism to avoid.
set -g @ssh_view '#{||:#{@ssh_host},#{m:local-*,#{session_name}}}'
# status bar — Everforest dark hard: bg_dim (#1e2326), fg (#d3c6aa).
# Over ssh the whole bar takes bg_purple (#463f48) rather than only the SSH
# label: a coloured chip is easy to miss on a screen whose content came from
# somewhere else, a full-width band is not. Styles are format-expanded, so the
# conditional lands here as well as on the borders (verified against tmux 3.7c).
set -g status-style '#{?#{E:@ssh_view},bg=#463f48 fg=#d3c6aa,bg=#1e2326 fg=#d3c6aa}'
set-option -g status-position top
set-option -g status-left-length 300
set-option -g status-right-length 300
# SSH indicator uses Everforest dark hard palette: purple (#d699b6), bg_purple
# (#463f48). Inverted against the bar, which is itself bg_purple over ssh — the
# badge has to out-contrast its own background, not just the default one.
set-option -g status-left '#{?@ssh_host,#[bg=#d699b6 fg=#463f48 bold] SSH: #{@ssh_host} #[default],#{pane_current_path}}'
# The #() runs continuum_save.sh on each status refresh (every status-interval seconds).
# Embedded here instead of relying on continuum's auto-injection, which breaks when
# other tmux servers (e.g. Claude Code) trigger its multi-server detection guard.
# The "push C-q+? to show help" hint sits to the left of the clock so the key
# that opens the cheatsheet is itself discoverable — a list of shortcuts you
# cannot reach is no better than no list. Spelled as a sentence rather than a
# "C-q ?:help" label: this line is read once, by someone who does not yet know
# the key exists, so it should not need decoding.
# Everforest grey1 (#859289) keeps it quieter than the clock.
set-option -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#859289]push C-q+? to show help #[default]%Y-%m-%d(%a) %H:%M'
set-option -g status-interval 30 # refresh interval (lower fork frequency for #() commands)
set-option -g status-justify centre
set-option -g automatic-rename off
set-option -g allow-rename off
# propagate window title to terminal (WezTerm tab name)
set -g set-titles on
# SSH pane: show a ≫ marker + remote pane title (propagated by remote
# tmux's set-titles or by the shell's OSC 2 escape). The host name is
# dropped here — it is already shown in status-left, and the tab is short.
# The marker matches the "≫" label tmux-pane-titles puts in window_name,
# so ssh tabs look the same whether the title comes from here or there.
# Local pane: show window name set by tmux-pane-titles.
#
# The leading #{P:...} walks every pane in the window and concatenates its
# @claude_glyph (set by ~/.claude/hooks/agent-state.sh), so a tab reads
# "🛑 dotfiles" while that session waits on a permission prompt. Reading the
# pane option directly keeps this free of any #() subprocess, so status-interval
# can stay at 30s; the hook calls `refresh-client -S` to redraw on transition.
#
# The glyph must be pre-computed into @claude_glyph rather than derived here
# with #{?@claude_state,...}: a comma inside a #{P:...} body terminates the loop
# body, so the conditional would truncate the format.
#
# SSH panes carry no local @claude_state — the remote's own set-titles-string
# already embeds its glyph, which arrives inside #{pane_title}. That renders as
# "≫ 🛑 dotfiles" (glyph after the marker) rather than leading the string,
# because it is part of the opaque title the remote sends.
set -g set-titles-string '#{P:#{@claude_glyph}}#{?@ssh_host,≫ #{pane_title},#{window_name}}'
# Window title updates moved to zsh precmd/chpwd hooks (directory.zsh).
# tmux server-side run-shell -b caused SIGSEGV in tty_keys_next due to
# fork racing with tty input processing (tmux 3.6a, macOS ARM64).
# Clean up old hooks on config reload.
set-hook -gu after-new-window
set-hook -gu after-new-session
set-hook -gu after-split-window
set-hook -gu window-layout-changed
# Track remote session switches for SSH auto-reconnect.
# tmux-track-session uses a per-connection polling monitor (started via
# run-shell in the attach command) instead of global hooks. This avoids
# race conditions from stale tty mappings when PTY numbers are reused
# on reconnect. Unset old hooks so a config reload cleans them up.
set-hook -gu client-session-changed
set-hook -gu client-detached

# pane borders
set -g pane-border-lines heavy           # thick Unicode box-drawing characters
set -g pane-border-indicators both       # colour + arrows to indicate active pane
# Everforest dark hard: bg3 (#414b50)
set -g pane-border-style 'fg=#414b50'
# Everforest palette: remote → purple (#d699b6), local → green (#a7c080).
# Keyed on @ssh_view, not @ssh_host, so the remote tmux — which draws these
# borders while you are inside myssh — paints them purple too. Inactive borders
# stay grey on both sides: the point is telling the two machines apart, and a
# second axis of colour on the quiet borders only adds noise.
set -g pane-active-border-style '#{?#{E:@ssh_view},fg=#d699b6,fg=#a7c080}'

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
# Patch tmux-fzf-url: drop -e from capture-pane.
# ANSI escapes embedded in scrollback can split a URL string and prevent
# xre's regex from matching it whole. Plain-text capture (-J alone) is
# sufficient because xre already uses --strip-ansi.
run-shell 'f="$HOME/.tmux/plugins/tmux-fzf-url/fzf-url.sh"; if [ -f "$f" ]; then sed -i.bak "s/capture-pane -J -p -e/capture-pane -J -p/g" "$f" && rm -f "$f.bak"; fi'
