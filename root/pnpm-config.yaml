# pnpm global config (linked to the platform-specific global config.yaml:
#   macOS -> ~/Library/Preferences/pnpm/config.yaml
#   Linux -> ~/.config/pnpm/config.yaml
# unless $XDG_CONFIG_HOME is set, in which case pnpm uses $XDG_CONFIG_HOME/pnpm/).
#
# Supply-chain hardening: minimum release age. Refuse to install any npm package
# version published less than 7 days ago, matching the npm min-release-age=7
# (~/.npmrc) and yarn npmMinimalAgeGate (~/.yarnrc.yml) windows.
#
# Not every pnpm reads this file, and one that does not says nothing. pnpm
# 10.17.0 ignored it -- `pnpm config get minimumReleaseAge` printed undefined
# and a 1-day-old release installed -- while 12.14.0 reads it and refuses that
# release with ERR_PNPM_NO_MATURE_MATCHING_VERSION (2026-10). After installing
# or bumping pnpm, check `pnpm config get minimumReleaseAge` prints 10080.
#
# Unit is MINUTES: 10080 = 7 days. Use minimumReleaseAgeExclude (names, globs, or
# specific versions) to exempt a package when a fresh release is genuinely needed.
minimumReleaseAge: 10080

# Exact version pins: record `1.2.3`, not `^1.2.3`, when adding a dependency, so
# an upgrade is always a deliberate, reviewable edit. Mirrors npm save-exact=true
# and yarn defaultSemverRangePrefix:"". Default is "^".
savePrefix: ''

# Do not run lifecycle scripts — the most common malware execution vector.
# Mirrors npm ignore-scripts=true and yarn enableScripts:false. pnpm >= 10 already
# blocks *dependency* build scripts unless allowlisted via onlyBuiltDependencies;
# this additionally blocks the project's own install/pre/post scripts. Allow a
# dependency's build per project via onlyBuiltDependencies in pnpm-workspace.yaml.
ignoreScripts: true
