# pip user config (linked to ~/.config/pip/pip.conf, which pip reads on macOS
# and Linux alike: `pip config debug` lists it).
#
# Supply-chain hardening: only consider files uploaded at least 7 days ago,
# the window ~/.npmrc (min-release-age=7), yarn, pnpm and the cooldown tools in
# bin/ use. P7D is an ISO 8601 duration; needs a pip that has
# --uploaded-prior-to (26.2 does).
# [global], not [install], so `pip download` and `pip wheel` are held too.
# For a release needed sooner, pass --uploaded-prior-to with a later datetime.
[global]
uploaded-prior-to = P7D
