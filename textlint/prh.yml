# prh（proofreading helper）表記辞書。textlint-rule-prh から参照する。
#
# 方針:
# - AI 生成ドキュメントで実際に見つかった「過剰に漢語化した用語」を現場表記へ寄せる。
# - 複合語などで意味が一意に特定できる語だけを入れる。単独では文脈依存の語
#   （展開・構成・索引など）は誤置換するため入れない。
# - 永続化・排他制御・冪等など、漢語が現場標準として定着している語は入れない。
# - 網羅は目指さない。AI 出力で見つけた語を随時追加する運用とする。
# - `pattern` に含み関係があるときは長い語を先に書く。prh はルール順に適用されるため、
#   短い語による部分置換（「逆直列化」→「逆デシリアライズ」等）を防げる。
#
# ============================================================================
# この辞書は 2 部構成である。適用前に必ず節の区別を確認すること。
#
#   セクション A: 方向が対象文書に依存しない規則。誤変換の修正、直訳による新造語、
#                 業界標準語への正規化。どのプロジェクトでもそのまま適用してよい。
#
#   セクション B: 方向がプロジェクトごとに割れる規則（主にカタカナ長音の表記ゆれ）。
#                 ここの `expected` は、ある実在リポジトリの Markdown 全量を数えて
#                 多数派を採った結果であって、一般的な正解ではない。理屈で決めた
#                 ものでもない。**別のプロジェクトへ適用する前に、そのプロジェクト
#                 での出現数を実測し、多数派が逆なら expected と pattern を入れ替える
#                 か、その規則を外すこと。**
#
# 実測の手順は lint-docs skill（root/.agents/skills/lint-docs/SKILL.md）に定義する。
# ============================================================================
version: 1
rules:
  # ==========================================================================
  # セクション A: 方向が文書に依存しない規則
  # ==========================================================================

  # --- 誤変換 ---
  # 「改鼠」という語は存在しない（「竄」の誤字）
  - expected: 改ざん
    pattern: 改鼠

  # --- 形態素直訳による新造語。原語または定着した訳語へ戻す ---
  - expected: Source of Truth
    pattern: 真実源
  # SSOT の直訳バリアント。長い語から先に置き、部分置換を防ぐ
  - expected: Source of Truth
    pattern: 単一の真実のソース
  - expected: Source of Truth
    pattern: 唯一の真実
  - expected: Source of Truth
    pattern: 単一の真実
  - expected: Source of Truth
    pattern: 単一情報源
  # "cryptographically unpredictable" の直訳
  - expected: 予測不能
    pattern: 不可予測
  # "consumption site" の直訳
  - expected: 利用箇所
    pattern: 消費箇所
  # "supply chain"。ソフトウェアセキュリティ文脈の業界標準はカタカナ
  - expected: サプライチェーン
    pattern: 供給網
  # "attack surface"。IPA の訳語
  - expected: 攻撃対象領域
    pattern: 攻撃面
  # "safety net"
  - expected: セーフティネット
    pattern: 安全網
  # "blast radius"。英語のまま書くのが技術文書の多数派表記。
  # 文字通りの爆発に言及する文書（製造・化学・防災）では textlint-disable で除外する
  - expected: blast radius
    pattern: ブラスト半径
  - expected: blast radius
    pattern: 爆発半径

  # --- 過剰に漢語化した技術用語 → 現場表記 ---
  - expected: キュー
    pattern: 待ち行列
  # 「逆直列化」を先に置く（後続の「直列化」による部分置換を防ぐ）
  - expected: デシリアライズ
    pattern: 逆直列化
  - expected: シリアライズ
    pattern: 直列化
  - expected: リトライ
    pattern: 再試行
  - expected: ストレージ
    pattern: 記憶域
  - expected: 設定ファイル
    pattern: 構成ファイル
  # 「クレデンシャル」派のプロジェクトでは expected を差し替える
  - expected: 認証情報
    pattern: 資格情報
  # 「ログ送出」等の正当な用法を巻き込まないよう「例外を送出」に限定する
  - expected: 例外をスロー
    pattern: 例外を送出
  # "health monitoring" の直訳。「健全性」単独は一般語のため複合語のみ
  - expected: 死活監視
    pattern: 健全性監視
  # DB インデックスの意味の「索引」。単独の「索引」には書籍の索引などの正当用法が
  # あるため入れず、DB 文脈で意味が一意になる複合語だけを入れる
  - expected: 複合インデックス
    pattern: 複合索引
  - expected: 日付インデックス
    pattern: 日付索引
  - expected: インデックス最適化
    pattern: 索引最適化
  - expected: インデックス追加
    pattern: 索引追加
  - expected: インデックス選択
    pattern: 索引選択
  # "media type"
  - expected: メディアタイプ
    pattern: 媒体タイプ
  # deploy の意味の「展開」。単独の「展開」は変数展開・横展開等があるため複合語のみ
  - expected: 本番デプロイ
    pattern: 本番展開

  # ==========================================================================
  # セクション B: 方向がプロジェクトに依存する規則
  #
  # 以下の expected は実在リポジトリでの出現数の多数派である（コメントの数値は
  # その採取時点の マッチ数 : マッチ数）。別プロジェクトへ適用する前に実測すること。
  # ==========================================================================

  # --- カタカナ長音: 「付ける」方向が多数派だった語 ---
  # 既存の長音形に二重適用して「〜ーー」を作らないよう、負の先読みを付ける
  - expected: サーバー # サーバー 354 : サーバ 30。「サーバレス」(5:0) は確立形なので除外する
    pattern: /サーバ(?!ー|レス)/
  - expected: ユーザー # ユーザー 466 : ユーザ 10。「ユーザビリティ」は標準形なので除外する
    pattern: /ユーザ(?!ー|ビリティ)/
  - expected: ヘッダー # ヘッダー 109 : ヘッダ 12
    pattern: /ヘッダ(?!ー)/
  - expected: スケジューラー # スケジューラー 8 : スケジューラ 3
    pattern: /スケジューラ(?!ー)/
  - expected: デコレーター # デコレーター 14 : デコレータ 6
    pattern: /デコレータ(?!ー)/
  - expected: コントローラー # コントローラー 26 : コントローラ 1
    pattern: /コントローラ(?!ー)/
  - expected: インターフェース # インターフェース 42 : インタフェース 2（インターフェイスは 0）
    pattern: インタフェース

  # --- カタカナ長音: 「外す」方向が多数派だった語 ---
  - expected: エントリ # エントリ 67 : エントリー 3
    pattern: エントリー
  - expected: クラスタ # クラスタ 35 : クラスター 19（クラスタリングは pattern 上マッチしない）
    pattern: クラスター
  - expected: サマリ # サマリ 31 : サマリー 12
    pattern: サマリー
  - expected: パラメータ # パラメータ 147 : パラメーター 4。違反は現状ゼロだが AI が書きがちなため予防的に登録
    pattern: パラメーター
  - expected: オーバーヘッド # オーバーヘッド 12 : オーバヘッド 5（部分文字列衝突なし）
    pattern: オーバヘッド
  - expected: ケイパビリティ # ケイパビリティ 9 ファイル : ケーパビリティ 1
    pattern: ケーパビリティ

  # --- 用語の正規化 ---
  # 「可観測性」を先に置く（「観測性」はその部分文字列。後段は負の後読みで「可」を除外）
  - expected: オブザーバビリティ # オブザーバビリティ 55 : 可観測性 11 : 観測性 4
    pattern: 可観測性
  - expected: オブザーバビリティ
    pattern: /(?<!可)観測性/
  # prefix / suffix はペアで統一する（プレフィックス 78 : 接頭辞 4、サフィックス 18 : 接尾辞 12。
  # 接尾辞側の多数派は僅差だが、同一文中でペア使用されるため片方だけの正規化は避ける）
  - expected: プレフィックス
    pattern: 接頭辞
  - expected: サフィックス
    pattern: 接尾辞
  - expected: 属性 # 属性 121 : アトリビュート 1。カタカナ→漢語の方向でも多数派に従う
    pattern: アトリビュート
  # 文書内で正式形と混在する口語略記
  - expected: スクリーンショット # スクリーンショット 22 : スクショ 19
    pattern: スクショ
  # 「既定値」「既定の」もこの 1 ルールで「デフォルト値」「デフォルトの」に置換される。
  #
  # 当初はセクション A（方向が文書に依存しない）に置いていたが、この辞書を最初に別
  # リポジトリへ当てた時点で分類の誤りが判明した。dotfiles では デフォルト 0 : 既定 2 で、
  # 方向が完全に逆だった。「既定」は過剰漢語化とは限らず、書き手が一貫して選んでいる
  # 表記でもありうる。
  # 加えて「既定路線」のような一般語も巻き込むため、技術文書以外へ適用するときは外す
  - expected: デフォルト # 採取元リポジトリでの多数派。適用先で必ず数え直すこと
    pattern: 既定
