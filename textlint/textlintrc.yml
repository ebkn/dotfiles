# 日本語ドキュメントの文体・表記を機械的に検査する textlint 設定。
#
# この設定は特定のプロジェクトに属さない。`bin/textlint-docs` が対象リポジトリの
# 外（キャッシュディレクトリ）へ複製して実行するため、検査対象のリポジトリには
# 設定ファイルも node_modules も一切置かない。
#
# 方針:
# - 人間が書いた既存文書を「正」とし、それに合わせてルールを調整する。
#   ルールに合わせて過去の文書を直すのではない。
# - AI 生成に特有の翻訳調・構造パターン（太字先頭リスト・英語式コロン・冗長表現・
#   過剰な漢語化）を機械的に検出する土台をつくる。
# - ルールの無効化・緩和には必ず理由コメントを付ける。
#
# ここに書かれた閾値は実在リポジトリの文書を実測して決めた出発点であって、普遍的な
# 正解ではない。対象プロジェクトの文書実態と食い違うときは、文書ではなく閾値を疑う。
#
# 実行: textlint-docs <パス...>（検査）/ textlint-docs --fix <パス...>（自動修正）
# エスケープ: <!-- textlint-disable --> 〜 <!-- textlint-enable -->（下記 comments filter）
# 対象外ファイル: textlint/textlintignore
filters:
  # HTML コメントによる部分的な無効化を有効化する。
  # 例: <!-- textlint-disable ja-technical-writing/sentence-length --> 〜 <!-- textlint-enable -->
  comments: true
rules:
  # 技術文書の日本語スタイル（冗長表現・文末統一・文長など）
  preset-ja-technical-writing:
    # 既定 100 字は、表・箇条書きを多用する設計文書に対して厳しく、人間が書いた
    # 文書でも多発する。
    #
    # この字数はインライン code も含めて数えられ、除外もできない
    # （rule は StringSource で記法を落としてから照合するため、skipPatterns で
    # `` `foo` `` を指定してもバッククォートが残っておらずマッチしない）。
    # 設定キー・SQL・リソース名の列挙が字数の大半を占める文書実態に合わせて 200 字とする。
    #
    # 注意: sentence-splitter は改行を文の区切りとして扱う。文書が固定幅で折り返されて
    # いると、折り返された断片が 1 文として数えられ、実質「文長」ではなく「行長」を
    # 測ることになる。折り返しのある文書でこのルールが静かなときは、緩いのではなく
    # 測れていない可能性を疑う。
    sentence-length:
      max: 200
    # 箇条書き項目や表を多用する文書では、句点で終わらない行が正当に多い。
    # 既定では体言止め・箇条書きの句点欠落を過剰検知するため、句点必須は無効化する
    # （常体/敬体の統一など、より本質的なルールを優先する）。
    ja-no-mixed-period: false
    # 疑問符は許可し、感嘆符は禁止のまま残す。
    # 技術文書で感嘆符は不要な情緒を持ち込むが、疑問符には「その文書・ツールが答える問い」を
    # 引用で示す正当な用法がある（例: 「このファイルのカバレッジは十分か？」）。
    no-exclamation-question-mark:
      allowHalfWidthQuestion: true
      allowFullWidthQuestion: true
    # 文体はファイル単位で自動判定する（空文字が既定＝多数派の文体を優先し、少数派だけを
    # 指摘する）。リポジトリ横断で常体へ固定しない。
    #
    # 文体の実態は文書の種類で割れており、どちらも正当である。
    #   - 設計文書・ADR: 常体（である）
    #   - README・手順書: 敬体（ですます）。読み手に手順を説明する文書として一貫している
    # 常体に固定すると、混在していない README 全体が一律に違反となる。これは
    # 「既存文書を正とし、ルールを文書に合わせる」という冒頭の方針に反する。
    #
    # 自動判定でも文体の混在そのものは検出できるため、ルールの本来の目的は損なわれない。
    # ファイルをまたいだ文体の統一は強制しなくなる点だけがトレードオフ。
    no-mix-dearu-desumasu:
      preferInBody: ""
      preferInList: ""
      preferInHeader: ""
    # 「〜することができる」等の冗長表現を検出するルール（textlint-rule-ja-no-redundant-expression@4.0.1）。
    # ノード境界（段落・箇条書き項目）をまたいでテキストを連結して解析するため、ソースに
    # 存在しない文字列にマッチする。結果として報告位置がずれ、--fix は無関係な単語の途中へ
    # 置換文字列を挿入して文章を破壊する。
    #
    # 再現（この 2 段落だけの md に textlint --fix を当てる）:
    #   ドメインロジックを安全に実装することができる
    #                                                    ← 空行
    #   Web アプリケーションを提供する
    # 「することができる」+「Web」を連結し、存在しない「することができるWeb」を指摘。
    # 2 段落目が「Web アプリケーションを提できるWeb供する」へ破壊される。
    # 逆に後続テキストが無いと検出自体されない（見逃し）。
    #
    # 上流は 4.0.1 で更新が停滞しており該当 issue も無いため、修正が入るまで無効化する。
    # 冗長表現の検出は、機械ではなくレビュー時の目視が担う。
    ja-no-redundant-expression: false
  # AI 特有の構造パターン（英語式コロン・機械的強調・誇張語・装飾絵文字）を検出する。
  # スコープ付き @textlint-ja/... が現行の保守対象（旧 textlint-rule-preset-ai-writing は
  # 更新停止。同一リポジトリの新名で no-ai-colon-continuation 等を追加で提供する）。
  "@textlint-ja/preset-ai-writing":
    # ai-tech-writing-guideline は「7 つの C」に基づく助言を info（非失敗）で出す
    # 曖昧な品質ナッジで、clean なファイルにも提案を積む。検出したい構造パターンとは
    # 別物でノイズになるため無効化する。構造検出は no-ai-emphasis-patterns /
    # no-ai-hype-expressions / no-ai-colon-continuation が担う。
    ai-tech-writing-guideline: false
    no-ai-list-formatting:
      # 太字先頭リスト（`- **用語**: 説明`）の検出を無効化する。
      # 判定は行頭の形だけを見る正規表現で、用語と値を対応させた定義リスト
      # （構成要素・採用理由の一覧など）にも一律に当たる。この形自体は読みやすく、
      # 機械的な羅列と定義リストを構文だけで区別する術がない。
      # 一律に指摘すると「既存文書を正とし、ルールを文書に合わせる」という
      # このファイル冒頭の方針に反して文面の書き換えを強いるため、検出しない。
      disableBoldListItems: true
      # 装飾絵文字（✅🚀🔥 等）のリストは検出したいので有効のまま残す。
  # 表記辞書（過剰漢語化した用語 → 現場表記、表記ゆれの統一）
  #
  # 相対パスはこの設定ファイルの位置から解決される。bin/textlint-docs は
  # textlintrc.yml と prh.yml を同じディレクトリへ複製して実行するため、この指定で
  # どの作業ディレクトリからでも解決できる。
  prh:
    rulePaths:
      - ./prh.yml
  # 漢字のひらき（副詞「予め」→「あらかじめ」等）。auto-fix 対応
  ja-hiragana-fukushi: true
  # 漢字のひらき（形式名詞「〜する事」→「〜すること」等）。auto-fix 対応
  ja-hiragana-keishikimeishi: true
  # 漢字のひらき（補助動詞「〜して下さい」→「〜してください」等）。auto-fix 対応
  ja-hiragana-hojodoushi: true
